services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: msim
      POSTGRES_USER: msim
      POSTGRES_PASSWORD: msim
    ports:
      - "5432:5432"
    volumes:
      - msim-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msim -d msim"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://msim:msim@postgres:5432/msim
      OUTPUT_DIR: /app/output
    volumes:
      - ./output:/app/output

volumes:
  msim-postgres-data:
